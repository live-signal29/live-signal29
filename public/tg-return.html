<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Back to Fx Signal Lab</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0f172a}
  .card{max-width:360px;margin:24px;padding:28px 22px;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.08);text-align:center}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:14px;color:#475569;margin:0 0 18px;line-height:1.5}
  a.btn{display:block;padding:13px 16px;border-radius:12px;font-weight:600;text-decoration:none;margin-top:10px}
  .primary{background:#2563eb;color:#fff}
  .ghost{background:#eef2f7;color:#0f172a}
</style>
</head>
<body>
<div class="card">
  <h1>Login confirmed ✅</h1>
  <p id="msg">Opening the app… you will be signed in automatically.</p>
  <a id="open" class="btn primary" href="#">Open the app</a>
  <a id="site" class="btn ghost" href="https://live-signal29.vercel.app/login">Continue in the browser</a>
  <a id="play" class="btn ghost" href="https://play.google.com/store/apps/details?id=co.median.android.krkqyaz">Get the app on Google Play</a>
</div>
<script>
(function () {
  var pkg = "co.median.android.krkqyaz";
  var host = "live-signal29.vercel.app";
  var site = "https://" + host + "/login";
  // Android: launch the installed app (the app finishes the login by itself); if it cannot be opened, fall back to the site.
  var intent = "intent://" + host + "/login#Intent;scheme=https;package=" + pkg +
               ";S.browser_fallback_url=" + encodeURIComponent(site) + ";end";
  var isAndroid = /Android/i.test(navigator.userAgent);
  document.getElementById("open").setAttribute("href", isAndroid ? intent : site);
  if (isAndroid) {
    window.location.href = intent;
  } else {
    document.getElementById("msg").textContent = "Continue on the website to finish signing in.";
    window.location.replace(site);
  }
})();
</script>
</body>
</html>
