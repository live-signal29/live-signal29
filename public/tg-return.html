<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Back to Live Signals</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#EFFFF8;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#0f172a}
  .card{max-width:340px;margin:24px;padding:28px 22px;border-radius:20px;background:#fff;box-shadow:0 10px 30px rgba(16,185,129,.18);text-align:center}
  .ok{font-size:42px;line-height:1}
  h1{font-size:20px;margin:12px 0 6px}
  p{font-size:14px;color:#475569;margin:0 0 18px}
  a.btn{display:block;padding:13px 16px;border-radius:12px;background:#16a34a;color:#fff;text-decoration:none;font-weight:600;margin-bottom:10px}
  a.alt{display:block;padding:12px 16px;border-radius:12px;border:1px solid #cbd5e1;color:#0f172a;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="ok">✅</div>
    <h1>Login confirmed</h1>
    <p>Opening the app… you will be signed in automatically.</p>
    <a class="btn" id="open" href="#">Open App</a>
    <a class="alt" href="https://live-signal29.vercel.app/">Continue on website</a>
  </div>
<script>
  // Android: launch the installed app (same appId as the Play Store build).
  var APP_ID = "co.median.android.krkqyaz";
  var isAndroid = /Android/i.test(navigator.userAgent);
  var intentUrl = "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=" + APP_ID +
    ";S.browser_fallback_url=" + encodeURIComponent("https://live-signal29.vercel.app/") + ";end";
  var btn = document.getElementById("open");
  btn.href = isAndroid ? intentUrl : "https://live-signal29.vercel.app/";
  if (isAndroid) { setTimeout(function(){ window.location.href = intentUrl; }, 400); }
  else { setTimeout(function(){ window.location.href = "https://live-signal29.vercel.app/"; }, 1200); }
</script>
</body>
</html>
