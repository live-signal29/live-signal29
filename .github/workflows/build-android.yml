name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon & splash
        run: |
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Kotlin duplicate class conflict
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set target/compile SDK to 36
        run: |
          sed -i "s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/" android/variables.gradle
          sed -i "s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" android/variables.gradle

      - name: Add OneSignal native SDK dependency
        run: |
          sed -i '/^dependencies {/a\    implementation("com.onesignal:OneSignal:[5.6.1, 5.9.99]")' android/app/build.gradle

      - name: Add notification permission + OneSignal native init
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:name=".OneSignalApp"/' android/app/src/main/AndroidManifest.xml

          APPDIR=android/app/src/main/java/co/median/android/krkqyaz
          mkdir -p "$APPDIR"

          cat > "$APPDIR/OneSignalApp.java" << 'EOF'
          package co.median.android.krkqyaz;

          import android.app.Application;
          import com.onesignal.OneSignal;

          public class OneSignalApp extends Application {
              @Override
              public void onCreate() {
                  super.onCreate();
                  try {
                      OneSignal.initWithContext(this, "ecd43f8e-031e-41f0-a082-9af60943a575");
                  } catch (Throwable t) {
                      // Never let a push-SDK issue crash the whole app
                      t.printStackTrace();
                  }
              }
          }
          EOF

          MAINACT=android/app/src/main/java/co/median/android/krkqyaz/MainActivity.java
          cat > "$MAINACT" << 'EOF'
          package co.median.android.krkqyaz;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;
          import com.onesignal.Continue;
          import com.onesignal.OneSignal;

          public class MainActivity extends BridgeActivity {

              // Exposed to the website as window.NativePush
              public class NativePush {
                  // Supabase user id becomes this device's OneSignal external_id
                  @JavascriptInterface
                  public void login(String externalId) {
                      try {
                          if (externalId != null && !externalId.isEmpty()) {
                              OneSignal.login(externalId);
                          }
                      } catch (Throwable t) {
                          t.printStackTrace();
                      }
                  }

                  @JavascriptInterface
                  public void logout() {
                      try {
                          OneSignal.logout();
                      } catch (Throwable t) {
                          t.printStackTrace();
                      }
                  }

                  // true if notifications are allowed for this app
                  @JavascriptInterface
                  public boolean hasPermission() {
                      try {
                          return OneSignal.getNotifications().getPermission();
                      } catch (Throwable t) {
                          return true;
                      }
                  }

                  // Shows the system permission dialog; if Android already blocked it
                  // (denied twice) it sends the user to the app's notification settings.
                  @JavascriptInterface
                  public void requestPermission() {
                      runOnUiThread(() -> {
                          try {
                              OneSignal.getNotifications().requestPermission(true, Continue.none());
                          } catch (Throwable t) {
                              t.printStackTrace();
                          }
                      });
                  }

                  @JavascriptInterface
                  public void openSettings() {
                      runOnUiThread(() -> {
                          try {
                              Intent intent = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                              intent.putExtra(Settings.EXTRA_APP_PACKAGE, getPackageName());
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } catch (Throwable t) {
                              t.printStackTrace();
                          }
                      });
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS)
                              != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this,
                                  new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                      }
                  }
                  try {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().addJavascriptInterface(new NativePush(), "NativePush");
                      }
                  } catch (Throwable t) {
                      t.printStackTrace();
                  }
              }
          }
          EOF

      - name: Set app version
        run: |
          sed -i "s/versionName \".*\"/versionName \"9.8.9.9.5\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $((90000 + ${{ github.run_number }}))/" android/app/build.gradle

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-key.jks

      - name: Add signing config
        run: |
          cat >> android/app/build.gradle << 'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file("upload-key.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build Release AAB (for Play Store)
        run: cd android && ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
